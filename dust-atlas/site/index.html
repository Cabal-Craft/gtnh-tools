<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GTNH Dust Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: a three-lane flowchart board. Sources (made by) feed in from the left, the focused item sits in the middle,
   processing and uses fan out to the right. Wires connect the item to each machine group. */
:root {
  --bg: #e9ecef;          /* machine-casing light steel */
  --panel: #f7f8f9;
  --panel-2: #dde2e7;
  --line: #c3cad2;
  --fg: #1d242c;
  --muted: #5b6672;
  --accent: #2f6fb0;      /* GT "LV-blue" accent */
  --wire: #8b98a6;
  --wire-hot: #2f6fb0;
  --focus-ring: #e0a000;
  /* Minecraft tooltip: stays the same in both themes on purpose */
  --tt-bg: rgba(16, 0, 16, .95);
  --tt-b1: #5000ff;
  --tt-b2: #28007f;
  --tt-fg: #ffffff;
  --tt-gray: #aaaaaa;
  --tt-dark: #555555;
  --tt-yellow: #ffff55;
  --f-display: "Pixelify Sans", "Courier New", monospace;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-data: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181d; --panel: #1c2128; --panel-2: #262d36; --line: #333c47; --fg: #e3e8ee; --muted: #8e9aa7;
    --accent: #6aa8e8; --wire: #4a5563; --wire-hot: #6aa8e8; --focus-ring: #f0b429; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181d; --panel: #1c2128; --panel-2: #262d36; --line: #333c47; --fg: #e3e8ee; --muted: #8e9aa7;
  --accent: #6aa8e8; --wire: #4a5563; --wire-hot: #6aa8e8; --focus-ring: #f0b429; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding-block: 14px 12px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font: 700 22px/1 var(--f-display); margin: 0; letter-spacing: .02em; }
.brand small { font: 12px var(--f-data); color: var(--muted); }
.search { position: relative; flex: 1 1 320px; max-width: 560px; min-width: 0; }
.search input {
  width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
}
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--muted); }
.results {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); max-height: min(60vh, 520px); overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
  padding: 4px;
}
.res { display: flex; align-items: center; gap: 10px; padding: 5px 8px; border-radius: 4px; cursor: pointer; }
.res[aria-selected="true"], .res:hover { background: var(--panel-2); }
.res .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .tag { font: 11px var(--f-data); color: var(--muted); white-space: nowrap; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.opts label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.trail { display: flex; flex-wrap: wrap; gap: 4px; padding-block: 10px 0; min-height: 34px; }
.crumb {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 3px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); font-size: 12px; cursor: pointer; max-width: 220px;
}
.crumb span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb.cur { border-color: var(--accent); }

/* ---------- icons ---------- */
.ic {
  display: inline-block; width: 32px; height: 32px; flex: none; image-rendering: pixelated;
  background-repeat: no-repeat; position: relative;
}
.ic.s20 { width: 20px; height: 20px; }
.ic.s64 { width: 64px; height: 64px; }
.ic.noimg { background: var(--panel-2); border-radius: 4px; }
.ic.noimg::after {
  content: attr(data-l); position: absolute; inset: 0; display: grid; place-items: center;
  font: 600 11px var(--f-data); color: var(--muted);
}
.ic.s64.noimg::after { font-size: 22px; }

/* ---------- board ---------- */
.board {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px) minmax(0, 1fr);
  gap: 56px; align-items: start; padding-block: 18px;
}
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wires path { fill: none; stroke: var(--wire); stroke-width: 1.5; }
.wires path.hot { stroke: var(--wire-hot); stroke-width: 2.5; }
.lane { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.lane > h2 {
  margin: 0; font: 600 12px var(--f-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  display: flex; justify-content: space-between; gap: 8px;
}
.lane.left > h2 { flex-direction: row-reverse; text-align: right; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
.hiddennote { font-size: 12px; color: var(--muted); }
.hiddennote button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; }

/* focus node */
.focus {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 150px);
  background: var(--panel); border: 2px solid var(--fg); border-radius: 8px; padding: 18px; display: flex;
  flex-direction: column; gap: 12px; z-index: 2;
}
.focus .head { display: flex; gap: 14px; align-items: center; }
.focus h3 { margin: 0; font: 700 21px/1.15 var(--f-display); text-wrap: balance; overflow-wrap: anywhere; }
.focus .formula { font: 600 15px var(--f-data); color: var(--accent); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { font: 11px var(--f-data); padding: 2px 7px; border-radius: 4px; background: var(--panel-2); color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-family: var(--f-data); font-size: 12px; }
.sibs { display: flex; flex-wrap: wrap; gap: 6px; }
.sib { display: flex; align-items: center; gap: 5px; padding: 2px 8px 2px 2px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); cursor: pointer; font-size: 12px; }
.sib.cur { border-color: var(--focus-ring); }
.counts { display: flex; gap: 8px; }
.counts div { flex: 1; background: var(--bg); border-radius: 6px; padding: 8px 10px; }
.counts b { display: block; font: 600 20px var(--f-data); font-variant-numeric: tabular-nums; }
.counts span { font-size: 12px; color: var(--muted); }

/* machine group (a node on the board) */
.grp { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 0; }
.grp.hot { border-color: var(--wire-hot); }
.grp > header {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; user-select: none;
  border-bottom: 1px solid transparent;
}
.grp:not(.closed) > header { border-bottom-color: var(--line); }
.grp > header h4 { margin: 0; font: 600 14px var(--f-body); flex: 1; min-width: 0; }
.grp > header .n { font: 12px var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.grp > header .car { width: 10px; height: 10px; fill: var(--muted); transition: transform .15s; }
.grp.closed > header .car { transform: rotate(-90deg); }
.grp.closed .body { display: none; }
.body { display: flex; flex-direction: column; }
.more { margin: 6px 12px 10px; align-self: flex-start; background: none; border: 1px solid var(--line); border-radius: 4px;
  padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--accent); }

/* recipe row */
.rec { display: flex; flex-direction: column; gap: 5px; padding: 9px 12px; border-top: 1px solid var(--line); }
.rec:first-child { border-top: 0; }
.flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stacks { display: flex; flex-wrap: wrap; gap: 3px; min-width: 0; }
.arrow { color: var(--muted); font: 600 16px var(--f-data); }
.st { position: relative; display: inline-flex; cursor: pointer; border-radius: 3px; padding: 1px; background: var(--bg); }
.st:hover { background: var(--panel-2); }
.st.me { box-shadow: 0 0 0 2px var(--focus-ring); }
.st .q {
  position: absolute; right: 0; bottom: -1px; font: 700 11px/1 var(--f-data); color: #fff;
  text-shadow: 1px 1px 0 #3f3f3f, -1px 0 0 #3f3f3f, 0 -1px 0 #3f3f3f; pointer-events: none;
}
.st .c {
  position: absolute; left: 0; top: -1px; font: 700 9px/1 var(--f-data); color: var(--tt-yellow);
  text-shadow: 1px 1px 0 #3f3f3f; pointer-events: none;
}
.st.fl .q { font-size: 9px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font: 11.5px var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.tier { padding: 0 5px; border-radius: 3px; color: #fff; font-weight: 600; }

/* Minecraft-style tooltip */
.tt {
  position: fixed; z-index: 100; pointer-events: none; max-width: 360px; padding: 5px 7px; font: 14px/1.35 var(--f-body);
  background: var(--tt-bg); color: var(--tt-fg); border: 2px solid transparent; border-radius: 3px;
  background-clip: padding-box; box-shadow: 0 0 0 1px var(--tt-bg);
}
.tt::before {
  content: ""; position: absolute; inset: -1px; border-radius: 2px; padding: 1px; pointer-events: none;
  background: linear-gradient(var(--tt-b1), var(--tt-b2));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.tt .t1 { font-weight: 600; }
.tt .y { color: var(--tt-yellow); font-family: var(--f-data); font-size: 13px; }
.tt .g { color: var(--tt-gray); }
.tt .d { color: var(--tt-dark); font-family: var(--f-data); font-size: 11px; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); font: 14px var(--f-data); }

/* ---------- view tabs ---------- */
.views { display: flex; gap: 2px; background: var(--panel-2); border-radius: 7px; padding: 3px; }
.views a {
  padding: 5px 12px; border-radius: 5px; color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500;
  white-space: nowrap;
}
.views a[aria-current="page"] { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.views a:hover { color: var(--fg); }

/* ---------- machine filter bar (flowchart) ---------- */
.mfilter { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding-block: 10px 0; }
.mfilter .lbl { font: 600 11px var(--f-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.mchip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12.5px;
  border: 1px solid var(--line); background: var(--panel); cursor: pointer;
}
.mchip .n { font: 11px var(--f-data); color: var(--muted); }
.mchip[aria-pressed="false"] { background: transparent; color: var(--muted); text-decoration: line-through; border-style: dashed; }
.linkbtn { background: none; border: 0; padding: 3px 6px; color: var(--accent); cursor: pointer; font-size: 12.5px; }

/* ---------- list pages ---------- */
.page { padding-block: 18px; display: flex; flex-direction: column; gap: 16px; }
.page > h2 { margin: 0; font: 700 24px/1.1 var(--f-display); text-wrap: balance; }
.page .sub { margin: -8px 0 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.controls input[type="search"], .controls select {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); min-width: 0;
}
.controls input[type="search"] { flex: 1 1 260px; max-width: 420px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: var(--panel); padding: 6px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.count { font: 12px var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; }
.letters { display: flex; flex-wrap: wrap; gap: 2px; }
.letters a { font: 600 12px var(--f-data); padding: 3px 6px; border-radius: 4px; color: var(--accent); text-decoration: none; }
.letters a:hover { background: var(--panel-2); }
.letter-h { font: 700 18px var(--f-display); margin: 8px 0 0; padding-bottom: 4px; border-bottom: 1px solid var(--line); scroll-margin-top: 160px; }
.dgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 6px; }
.dcard {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 6px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); cursor: pointer; text-align: left; min-width: 0;
}
.dcard:hover { border-color: var(--accent); }
.dcard .tx { min-width: 0; display: flex; flex-direction: column; }
.dcard .nm { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dcard .fo { font: 11px var(--f-data); color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dcard .ct { font: 11px var(--f-data); color: var(--muted); font-variant-numeric: tabular-nums; }

/* machine index */
.cat { display: flex; flex-direction: column; gap: 8px; }
.cat h3 { margin: 0; font: 600 12px var(--f-data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 8px; }
.mcard {
  display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: inherit; text-decoration: none;
}
.mcard:hover { border-color: var(--accent); }
.mcard b { font-weight: 600; }
.mcard .row { display: flex; gap: 3px; min-height: 20px; }
.mtabs { display: flex; flex-wrap: wrap; gap: 6px; }
.mtabs a { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: inherit; text-decoration: none; background: var(--panel); }
.mtabs a[aria-current="page"] { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.mtabs a .n { font: 11px var(--f-data); opacity: .7; margin-left: 4px; }
.rgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 8px; align-items: start; }
.rgrid .rec { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.rgrid .rec:first-child { border-top: 1px solid var(--line); }
.crumbs { font-size: 13px; color: var(--muted); }
.crumbs a { color: var(--accent); text-decoration: none; }

@media (max-width: 980px) {
  .board { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .wires { display: none; }
  .focus { position: static; order: -1; }
  .lane.left > h2 { flex-direction: row; text-align: left; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Dust Atlas</h1><small id="ver">GTNH 2.9.0-RC1</small></div>
  <nav class="views" aria-label="Views">
    <a href="#flow" data-v="flow">Flowchart</a><a href="#dusts" data-v="dusts">All dusts</a><a href="#machines" data-v="machines">Machines</a>
  </nav>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12z"/></svg>
    <input id="q" type="search" placeholder="Search dusts: bauxite, Fe, tiny iron, pyrite…" autocomplete="off" aria-label="Search items" role="combobox" aria-expanded="false" aria-controls="results">
    <div class="results" id="results" role="listbox" hidden></div>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="optDust" checked> Dusts only in search</label>
    <label><input type="checkbox" id="optRecycle" checked> Hide recycling</label>
    <label><input type="checkbox" id="optDup" checked> Merge multiblock duplicates</label>
  </div>
</header>
<nav class="trail" id="trail" aria-label="Recently viewed"></nav>
<div class="mfilter" id="mfilter" hidden></div>
<main class="board" id="board"><div class="loading" id="loading">Loading 60,435 recipes…</div></main>
<main class="page" id="page" hidden></main>
<div class="tt" id="tt" hidden></div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

// GT voltage tiers (max EU/t per tier) and their in-game colours
const TIERS = [['ULV', 8, '#7a7a7a'], ['LV', 32, '#6c7a89'], ['MV', 128, '#d97d16'], ['HV', 512, '#c9a800'],
  ['EV', 2048, '#8b3fc9'], ['IV', 8192, '#2a55d4'], ['LuV', 32768, '#d43aa6'], ['ZPM', 131072, '#1b9e8a'],
  ['UV', 524288, '#2e9e2e'], ['UHV', 2097152, '#b32424'], ['UEV', 8388608, '#4e9f29'], ['UIV', 33554432, '#1f6e8c'],
  ['UMV', 134217728, '#a0306b'], ['UXV', 536870912, '#6b2b9c'], ['MAX', Infinity, '#cc2222']];
const tierOf = eu => TIERS.find(t => Math.abs(eu) <= t[1]);

// Order machine groups the way you'd walk a dust through processing
const PRIORITY = ['smelting', 'gt.recipe.macerator', 'gt.recipe.centrifuge', 'gt.recipe.electrolyzer',
  'gt.recipe.thermalcentrifuge', 'gt.recipe.orewasher', 'gt.recipe.simplewasher', 'gt.recipe.chemicalbath',
  'gt.recipe.sifter', 'gt.recipe.electromagneticseparator', 'gt.recipe.mixer', 'gt.recipe.blastfurnace',
  'gt.recipe.primitiveblastfurnace', 'gt.recipe.alloysmelter', 'gt.recipe.chemicalreactor', 'gt.recipe.largechemicalreactor',
  'gt.recipe.autoclave', 'gt.recipe.compressor', 'gt.recipe.implosioncompressor', 'gt.recipe.hammer',
  'gt.recipe.packager', 'gt.recipe.unpackager', 'crafting'];
const DUP_OF = { 'gt.recipe.multicentrifuge': 'gt.recipe.centrifuge', 'gt.recipe.multielectro': 'gt.recipe.electrolyzer',
  'gt.recipe.multimixer': 'gt.recipe.mixer', 'gt.recipe.largechemicalreactor': 'gt.recipe.chemicalreactor',
  'gt.recipe.fakecuttingsaw': 'gt.recipe.cuttingsaw' };
const RECYCLERS = new Set(['gt.recipe.macerator', 'gt.recipe.arcfurnace', 'gt.recipe.fluidextractor', 'gt.recipe.pulveriser']);
const PAGE = 6;

const TRAIL_MAX = 20;
let D, N, M, prod, use, dupHidden, searchIdx, byMachine, atlasOk = false;
let trail = store.get('da.trail', []), focusN = -1, view = '', expanded = {}, open = {};
const hideM = new Set(store.get('da.hideM', []));
const isDust = n => !!(N[n].p && N[n].p.startsWith('dust'));
const opt = { dust: store.get('da.dust', true), recycle: store.get('da.recycle', true), dup: store.get('da.dup', true) };
$('#optDust').checked = opt.dust; $('#optRecycle').checked = opt.recycle; $('#optDup').checked = opt.dup;

// ---------- icons: 64x64 grid of 32px cells per atlas page ----------
function iconHTML(i, size = 32) {
  const n = N[i], cls = size === 64 ? ' s64' : size === 20 ? ' s20' : '';
  if (!atlasOk) return `<i class="ic noimg${cls}" data-l="${esc((n.n || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2))}"></i>`;
  const p = i >> 12, x = (i & 63), y = (i >> 6) & 63, k = size / 32;
  return `<i class="ic${cls}" style="background-image:url(atlas/a${p}.png);background-size:${2048 * k}px;background-position:-${x * size}px -${y * size}px"></i>`;
}

// ---------- load ----------
Promise.all([fetch('data.json').then(r => r.json()),
  new Promise(res => { const im = new Image(); im.onload = () => res(true); im.onerror = () => res(false); im.src = 'atlas/a0.png'; })])
.then(([data, ok]) => {
  D = data; N = D.nodes; M = D.machines; atlasOk = ok;
  $('#ver').textContent = D.version;
  prod = Array.from({ length: N.length }, () => []); use = Array.from({ length: N.length }, () => []);

      <input type="search" id="mq" placeholder="Filter by dust or item, e.g. iron, Fe, tiny" value="${esc(machState.q)}" aria-label="Filter recipes">
      <div class="seg" role="group" aria-label="Where the dust is">
        <button data-role="any" aria-pressed="${machState.role === 'any'}">Any</button><button data-role="in" aria-pressed="${machState.role === 'in'}">Dust goes in</button><button data-role="out" aria-pressed="${machState.role === 'out'}">Dust comes out</button>
      </div>
      <select id="msort" aria-label="Sort recipes">
        <option value="default">Sort: simplest first</option><option value="eu">Sort: lowest EU/t</option><option value="eud">Sort: highest EU/t</option><option value="time">Sort: fastest</option><option value="name">Sort: first input name</option>
      </select>
      <span class="count" id="mcount"></span>
    </div>
    <div id="mlist"></div>`;
  $('#msort').value = machState.sort;
  renderMachineList();
  window.scrollTo({ top: 0 });
}
function renderMachineList() {
  if (view !== 'machine') return;
  const mi = machState.mi, words = machState.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let match = null;
  if (words.length) { match = new Set(); N.forEach((_, i) => { if (words.every(w => searchIdx[i].s.includes(w))) match.add(i); }); }
  const hit = (stacks, needDust) => stacks.some(s => (match ? match.has(s[0]) : true) && (!needDust || isDust(s[0])));
  let l = visibleRecipes(mi).filter(ri => {
    const r = D.recipes[ri];
    if (machState.role === 'in') return hit(r[1], !match);
    if (machState.role === 'out') return hit(r[2], !match);
    return !match || hit(r[1]) || hit(r[2]);
  });
  const R = D.recipes, nm = ri => (R[ri][1][0] ? N[R[ri][1][0][0]].n : '').toLowerCase();
  const sorts = {
    default: (a, b) => (R[a][1].length - R[b][1].length) || Math.abs(R[a][3]) - Math.abs(R[b][3]),
    eu: (a, b) => Math.abs(R[a][3]) - Math.abs(R[b][3]), eud: (a, b) => Math.abs(R[b][3]) - Math.abs(R[a][3]),
    time: (a, b) => R[a][4] - R[b][4], name: (a, b) => nm(a).localeCompare(nm(b)) };
  l.sort(sorts[machState.sort] || sorts.default);
  $('#mcount').textContent = `${l.length.toLocaleString()} recipes`;
  const shown = l.slice(0, machState.lim), rest = l.length - shown.length;
  $('#mlist').innerHTML = l.length
    ? `<div class="rgrid">${shown.map(ri => recipeHTML(ri, match || -1)).join('')}</div>${rest > 0 ? `<button class="more" data-mmore>Show ${Math.min(rest, 120)} more of ${rest.toLocaleString()}</button>` : ''}`
    : `<div class="empty">No recipes in this machine match${machState.q ? ` “${esc(machState.q)}”` : ''}.</div>`;
}

// ---------- page interactions ----------
let typing;
$('#page').addEventListener('input', e => {
  clearTimeout(typing);
  if (e.target.id === 'dq') typing = setTimeout(() => { dustState.q = e.target.value; renderDustList(); }, 120);
  if (e.target.id === 'mq') typing = setTimeout(() => { machState.q = e.target.value; machState.lim = 120; renderMachineList(); }, 160);
});
$('#page').addEventListener('change', e => {
  if (e.target.id === 'dsort') { dustState.sort = e.target.value; renderDustList(); }
  if (e.target.id === 'msort') { machState.sort = e.target.value; renderMachineList(); }
});
$('#page').addEventListener('click', e => {
  const n = e.target.closest('.st, .dcard'); if (n) { go(+n.dataset.n); return; }
  const p = e.target.closest('[data-p]');
  if (p) { dustState.p = p.dataset.p; p.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === p)); renderDustList(); return; }
  const r = e.target.closest('[data-role]');
  if (r) { machState.role = r.dataset.role; machState.lim = 120; r.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === r)); renderMachineList(); return; }
  if (e.target.closest('[data-mmore]')) { machState.lim += 120; renderMachineList(); return; }
  const L = e.target.closest('[data-letter]');
  if (L) { e.preventDefault(); const el = document.getElementById('L-' + (L.dataset.letter === '#' ? 'num' : L.dataset.letter)); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
});
$('#page').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.st')) { e.preventDefault(); e.target.closest('.st').click(); }
});

// ---------- tooltip ----------
const tt = $('#tt');
const MC = { 0: '#000', 1: '#00a', 2: '#0a0', 3: '#0aa', 4: '#a00', 5: '#a0a', 6: '#fa0', 7: '#aaa', 8: '#555', 9: '#55f',
  a: '#5f5', b: '#5ff', c: '#f55', d: '#f5f', e: '#ff5', f: '#fff' };
function mcText(s) { // render §-formatting codes
  let out = '', col = null, bold = false, ital = false;
  const parts = String(s).split(/§(.)/);
  for (let i = 0; i < parts.length; i++) {
    if (i % 2) { const c = parts[i].toLowerCase(); if (MC[c]) { col = MC[c]; bold = ital = false; } else if (c === 'l') bold = true; else if (c === 'o') ital = true; else if (c === 'r') { col = null; bold = ital = false; } continue; }
    if (!parts[i]) continue;
    out += `<span style="${col ? 'color:' + col + ';' : ''}${bold ? 'font-weight:700;' : ''}${ital ? 'font-style:italic;' : ''}">${esc(parts[i])}</span>`;
  }
  return out;
}
function showTT(el, ev) {
  const n = +el.dataset.n, x = N[n], q = +el.dataset.q, c = el.dataset.c, ore = el.dataset.o;
  let h = `<div class="t1">${esc(x.n)}</div>`;
  if (x.fo) h += `<div class="y">${esc(x.fo)}</div>`;
  if (x.f) h += `<div class="g">${q.toLocaleString()} mB${x.g ? ' · gas' : ''}${x.T ? ` · ${x.T} K` : ''}</div>`;
  else if (q === 0) h += `<div class="g">Not consumed</div>`;
  else if (q > 1) h += `<div class="g">×${q}</div>`;
  if (c) h += `<div class="y">${+(c / 100).toFixed(2)}% chance</div>`;
  if (ore) h += `<div class="g">Any <span style="color:#5ff">${esc(ore)}</span></div>`;
  (x.t || []).forEach(t => h += `<div class="g">${mcText(t)}</div>`);
  h += `<div class="d">${esc(x.k)}</div><div style="color:#55f;font-style:italic;font-size:12px">click to open</div>`;
  tt.innerHTML = h; tt.hidden = false; moveTT(ev);
}
function moveTT(ev) {
  const w = tt.offsetWidth, hh = tt.offsetHeight;
  let x = ev.clientX + 14, y = ev.clientY - 10;
  if (x + w > innerWidth - 8) x = ev.clientX - w - 14;
  if (y + hh > innerHeight - 8) y = innerHeight - hh - 8;
  tt.style.left = Math.max(8, x) + 'px'; tt.style.top = Math.max(8, y) + 'px';
}
function hideTT() { tt.hidden = true; }
document.addEventListener('mouseover', e => { const st = e.target.closest('.st, .res, .crumb, .sib, .dcard'); if (st && st.dataset.n) showTT(st, e); else if (!e.target.closest('.st')) hideTT(); });
document.addEventListener('mousemove', e => { if (!tt.hidden) moveTT(e); });
document.addEventListener('focusin', e => { const st = e.target.closest('.st'); if (st) { const r = st.getBoundingClientRect(); showTT(st, { clientX: r.right, clientY: r.top }); } });
document.addEventListener('focusout', hideTT);

// ---------- search ----------
const q = $('#q'), res = $('#results'); let hits = [], sel = 0;
function doSearch() {
  const s = q.value.trim().toLowerCase();
  if (!s || !searchIdx) { res.hidden = true; q.setAttribute('aria-expanded', 'false'); return; }
  const words = s.split(/\s+/);
  const exactFormula = searchIdx.filter(x => (N[x.i].fo || '').toLowerCase() === s);
  hits = [];
  for (const x of searchIdx) {
    if (opt.dust && !x.dust) continue;
    if (words.every(w => x.s.includes(w))) hits.push(x);
  }
  const nm = i => N[i].n.toLowerCase();
  const pr = { dust: 0, dustSmall: 1, dustTiny: 2, dustImpure: 3, dustPure: 4 };
  hits.sort((a, b) => (nm(a.i).startsWith(s) ? 0 : 1) - (nm(b.i).startsWith(s) ? 0 : 1) || (pr[N[a.i].p] ?? 5) - (pr[N[b.i].p] ?? 5) || nm(a.i).length - nm(b.i).length);
  exactFormula.reverse().forEach(x => { if (!opt.dust || x.dust) { hits = hits.filter(h => h.i !== x.i); hits.unshift(x); } });
  hits = hits.slice(0, 60); sel = 0;
  res.innerHTML = hits.length ? hits.map((x, k) => { const n = N[x.i];
    return `<div class="res" role="option" id="r${k}" data-n="${x.i}" aria-selected="${k === 0}">${iconHTML(x.i, 20)}<span class="nm">${esc(n.n)}</span><span class="tag">${esc(n.fo || n.p || (n.f ? 'fluid' : ''))}</span></div>`; }).join('')
    : `<div class="empty" style="padding:8px">No ${opt.dust ? 'dusts' : 'items'} match “${esc(q.value)}”.${opt.dust ? ' Untick “Dusts only” to search every item.' : ''}</div>`;
  res.hidden = false; q.setAttribute('aria-expanded', 'true');
}
function pick(i) { res.hidden = true; q.setAttribute('aria-expanded', 'false'); q.blur(); hideTT(); go(i); }
q.addEventListener('input', doSearch);
q.addEventListener('focus', () => { if (q.value) doSearch(); });
q.addEventListener('keydown', e => {
  if (res.hidden || !hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % hits.length;
    res.querySelectorAll('.res').forEach((r, k) => r.setAttribute('aria-selected', k === sel));
    $('#r' + sel).scrollIntoView({ block: 'nearest' }); q.setAttribute('aria-activedescendant', 'r' + sel);
  } else if (e.key === 'Enter') { e.preventDefault(); pick(hits[sel].i); }
  else if (e.key === 'Escape') { res.hidden = true; }
});
res.addEventListener('mousedown', e => { const r = e.target.closest('.res'); if (r) { e.preventDefault(); pick(+r.dataset.n); } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === '/' && !e.target.closest('input, select, textarea')) { e.preventDefault(); q.focus(); q.select(); } });
})();
</script>
</body>
